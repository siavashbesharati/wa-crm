<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>وضعیت افزونه</title>
  <link
    href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    rel="stylesheet"
    type="text/css"
  />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="popup-header">
    <div class="brand-row">
      <img class="brand-logo" src="icons/icon32.png" alt="" width="28" height="28" />
      <div>
        <div class="brand">iranexpedia</div>
        <div class="subtitle">افزونه چندکاناله</div>
      </div>
    </div>
    <div id="ext-version" class="version">v?</div>
  </header>

  <section id="connected-view" class="connected-card hidden">
    <div class="connected-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="48" height="48" fill="none">
        <circle cx="24" cy="24" r="22" fill="#dcfce7" />
        <circle cx="24" cy="24" r="22" stroke="#86efac" stroke-width="2" />
        <path
          d="M14 25.5 20.5 32 34 16.5"
          stroke="#16a34a"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <h2 class="connected-title">متصل</h2>
    <p id="connected-org" class="connected-org"></p>
    <p class="hint-line">ورود و مدیریت از پنل کناری واتساپ / دیوار</p>
    <button type="button" id="cloud-disconnect" class="logout-btn">خروج</button>
  </section>

  <section id="login-view" class="license-card cloud-card">
    <div class="section-title">
      <h2>ورود از پنل کناری</h2>
      <span id="cloud-badge" class="license-badge off">قطع</span>
    </div>
    <p id="cloud-status" class="license-message">
      تب <strong>واتساپ وب</strong> یا <strong>چت دیوار</strong> را باز کنید و در پنل کناری توکن صندلی را وارد کنید.
    </p>
    <a
      class="primary-wide"
      id="open-wa"
      href="https://web.whatsapp.com"
      target="_blank"
      rel="noopener"
      style="display:block;text-align:center;text-decoration:none;margin-bottom:8px"
    >
      باز کردن واتساپ
    </a>
    <a
      class="primary-wide"
      id="open-divar"
      href="https://divar.ir/chat"
      target="_blank"
      rel="noopener"
      style="display:block;text-align:center;text-decoration:none;background:#0f172a;border-color:#0f172a"
    >
      باز کردن چت دیوار
    </a>
  </section>

  <footer class="app-footer">
    <div>نسخه <span id="footer-version">?</span></div>
  </footer>

  <script src="cloud-bridge.js"></script>
  <script src="auth-gate.js"></script>
  <script src="popup.js"></script>
</body>
</html>
