<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود افزونه</title>
  <link
    href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    rel="stylesheet"
    type="text/css"
  />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">اتصال افزونه</div>
    <div class="subtitle">توکن صندلی یکتا برای این نصب</div>
    <div id="ext-version" class="version">v?</div>
  </header>

  <section class="license-card cloud-card">
    <div class="section-title">
      <h2>توکن صندلی</h2>
      <span id="cloud-badge" class="license-badge off">قطع</span>
    </div>
    <p id="cloud-status" class="license-message">
      توکن را از پنل کسب‌وکار → صندلی‌های افزونه کپی کنید.
    </p>
    <form id="cloud-form">
      <label>
        توکن صندلی
        <input
          id="cloud-seat-token"
          type="text"
          placeholder="seat_..."
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <div class="license-actions">
        <button type="button" id="cloud-login-btn">اتصال</button>
        <button type="button" id="cloud-disconnect" class="secondary-btn">قطع اتصال</button>
      </div>
    </form>
    <p class="hint" style="margin-top:10px;font-size:11px;opacity:.85;line-height:1.6">
      هر توکن فقط روی یک نصب Chrome قفل می‌شود. برای دستگاه دیگر توکن جدید بسازید یا
      مدیر صندلی را ریست کند.
    </p>
  </section>

  <footer class="app-footer">
    <div>نسخه <span id="footer-version">?</span></div>
  </footer>

  <script src="cloud-bridge.js"></script>
  <script src="auth-gate.js"></script>
  <script src="popup.js"></script>
</body>
</html>
