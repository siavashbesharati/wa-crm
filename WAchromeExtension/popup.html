<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود</title>
  <link
    href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    rel="stylesheet"
    type="text/css"
  />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">ورود</div>
    <div class="subtitle">فقط شماره و کد</div>
    <div id="ext-version" class="version">v?</div>
  </header>

  <section class="license-card cloud-card">
    <div class="section-title">
      <h2>تأیید هویت</h2>
      <span id="cloud-badge" class="license-badge off">قطع</span>
    </div>
    <p id="cloud-status" class="license-message">شماره را وارد کنید.</p>
    <form id="cloud-form">
      <label>
        موبایل
        <input id="cloud-phone" type="text" placeholder="0912..." autocomplete="tel" />
      </label>
      <label id="cloud-code-wrap" class="hidden">
        کد
        <input id="cloud-code" type="text" placeholder="OTP" inputmode="numeric" />
      </label>
      <div class="license-actions">
        <button type="button" id="cloud-otp-btn">دریافت کد</button>
        <button type="button" id="cloud-login-btn">ورود</button>
      </div>
      <div class="license-actions" style="margin-top:8px">
        <button type="button" id="cloud-disconnect" class="secondary-btn">خروج</button>
      </div>
    </form>
  </section>

  <footer class="app-footer">
    <div>نسخه <span id="footer-version">?</span></div>
  </footer>

  <script src="cloud-bridge.js"></script>
  <script src="auth-gate.js"></script>
  <script src="popup.js"></script>
</body>
</html>
