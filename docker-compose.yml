# Miogen / Iranexpedia — production-ready single compose file
#
# VPS (first time, once):
#   sudo cp deploy/nginx-miogen.example.conf /etc/nginx/sites-available/miogen
#   sudo ln -sf /etc/nginx/sites-available/miogen /etc/nginx/sites-enabled/miogen
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then every deploy:
#   docker compose up -d --build
#
# No .env required — defaults target https://miogen.iranexpedia.ir
# Optional: copy .env.example → .env only to override secrets (SMS key, DB password).

name: iranexpedia

x-app-env: &app_env
  APP_ENV: production
  CORS_ORIGINS: https://miogen.iranexpedia.ir,http://localhost:3000,http://127.0.0.1:3000
  PUBLIC_BASE_URL: https://miogen.iranexpedia.ir
  WEB_BASE_URL: https://miogen.iranexpedia.ir
  SUPER_ADMIN_PHONE: "09120674032"
  SMS_IR_DEV_FALLBACK: "false"
  DEMO_ENABLED: "true"
  TZ: Asia/Tehran

services:

  db:
    image: postgres:16-alpine
    container_name: iranexpedia-db
    # Service name is "db" (not postgres). Shell: docker compose exec db psql -U crm -d crm
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iranexpedia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./platform/api
      dockerfile: Dockerfile
    image: iranexpedia-api:latest
    container_name: iranexpedia-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app_env
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
      REDIS_URL: redis://redis:6379/0
    volumes:
      - api_secrets:/app/.local
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ./platform/api
      dockerfile: Dockerfile
    image: iranexpedia-api:latest
    container_name: iranexpedia-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *app_env
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
      REDIS_URL: redis://redis:6379/0
    volumes:
      - api_secrets:/app/.local
    command: ["python", "-m", "app.workers.runner"]
    healthcheck:
      disable: true

  wa-connector:
    build:
      context: ./platform/wa-connector
      dockerfile: Dockerfile
    image: iranexpedia-wa-connector:latest
    container_name: iranexpedia-wa
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      WA_API_BASE_URL: http://api:8000/api
      WA_CONNECTOR_PORT: "8090"
      WA_CONNECTOR_KEY_FILE: /run/secrets/wa_connector_key
      LOG_LEVEL: info
    volumes:
      - wa_auth:/app/baileys_auth
      - api_secrets:/app/api_secrets:ro
    expose:
      - "8090"

  divar-connector:
    build:
      context: ./platform/divar-connector
      dockerfile: Dockerfile
    image: iranexpedia-divar-connector:latest
    container_name: iranexpedia-divar
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      CRM_API_BASE: http://api:8000/api
      DIVAR_CONNECTOR_PORT: "8091"
    volumes:
      - api_secrets:/app/api_secrets:ro
    expose:
      - "8091"

  bale-connector:
    build:
      context: ./platform/bale-connector
      dockerfile: Dockerfile
    image: iranexpedia-bale-connector:latest
    container_name: iranexpedia-bale
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      CRM_API_BASE: http://api:8000/api
      BALE_CONNECTOR_PORT: "8092"
    volumes:
      - api_secrets:/app/api_secrets:ro
    expose:
      - "8092"

  web:
    build:
      context: ./platform/web
      dockerfile: Dockerfile
    image: iranexpedia-web:latest
    container_name: iranexpedia-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  redisdata:
  api_secrets:
  wa_auth:

networks:
  default:
    name: iranexpedia-net
