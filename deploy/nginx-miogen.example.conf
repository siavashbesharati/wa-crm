# Legacy filename — use deploy/nginx-bidar.example.conf
# Domain: bidar-app.ir (Cloudflare Origin CA)

server {
    listen 80;
    listen [::]:80;
    server_name bidar-app.ir www.bidar-app.ir;

    location /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://bidar-app.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bidar-app.ir;

    ssl_certificate     /etc/nginx/ssl/bidar.crt;
    ssl_certificate_key /etc/nginx/ssl/bidar.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://bidar-app.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bidar-app.ir;

    ssl_certificate     /etc/nginx/ssl/bidar.crt;
    ssl_certificate_key /etc/nginx/ssl/bidar.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location ~ ^/api/(docs|redoc|openapi\.json)$ {
        return 404;
    }
}
