# Legacy filename — use deploy/nginx-bidar.example.conf
# Product domain: https://bidar-app.ir

server {
    listen 80;
    server_name bidar-app.ir www.bidar-app.ir;
    return 301 https://bidar-app.ir$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.bidar-app.ir;
    ssl_certificate     /etc/nginx/ssl/bidar.crt;
    ssl_certificate_key /etc/nginx/ssl/bidar.key;
    return 301 https://bidar-app.ir$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bidar-app.ir;

    ssl_certificate     /etc/nginx/ssl/bidar.crt;
    ssl_certificate_key /etc/nginx/ssl/bidar.key;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location ~ ^/api/(docs|redoc|openapi\.json)$ {
        return 404;
    }
}
