# Example Nginx site for bidar.iranexpedia.ir
# Install: sudo cp deploy/nginx-bidar.example.conf /etc/nginx/sites-available/bidar
#          sudo ln -s /etc/nginx/sites-available/bidar /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Requires Cloudflare Origin cert at:
#   /etc/nginx/ssl/bidar.crt
#   /etc/nginx/ssl/bidar.key
#
# Docker must publish web/api on 127.0.0.1 only (default in docker-compose.yml).

server {
    listen 80;
    server_name bidar.iranexpedia.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bidar.iranexpedia.ir;

    ssl_certificate     /etc/nginx/ssl/bidar.crt;
    ssl_certificate_key /etc/nginx/ssl/bidar.key;

    client_max_body_size 50M;

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI backend (browser calls NEXT_PUBLIC_API_URL → same origin /api)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Optional: hide OpenAPI in production
    location ~ ^/api/(docs|redoc|openapi\.json)$ {
        return 404;
    }
}
