# Nginx site for https://bidar-app.ir
#
# Install:
#   sudo cp deploy/nginx-bidar.example.conf /etc/nginx/sites-available/bidar
#   sudo ln -sf /etc/nginx/sites-available/bidar /etc/nginx/sites-enabled/bidar
#   # disable old miogen site if present:
#   sudo rm -f /etc/nginx/sites-enabled/miogen
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS with Certbot (Ubuntu/Debian):
#   sudo apt update && sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d bidar-app.ir -d www.bidar-app.ir
#
# Certbot will rewrite this file to add ssl_certificate lines.
# Until then, serve HTTP only so the ACME challenge can succeed.

server {
    listen 80;
    listen [::]:80;
    server_name bidar-app.ir www.bidar-app.ir;

    client_max_body_size 50M;

    # ACME / certbot webroot (harmless if unused)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # FastAPI backend (same-origin /api)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location ~ ^/api/(docs|redoc|openapi\.json)$ {
        return 404;
    }
}
