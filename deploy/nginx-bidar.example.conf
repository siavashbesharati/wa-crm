# Nginx site for https://bidar-app.ir behind Cloudflare
#
# Cloudflare setup (recommended):
#   1. DNS A record bidar-app.ir (+ www) → VPS IP, Proxy status = Proxied (orange cloud)
#   2. SSL/TLS → Overview → Full (strict)
#   3. SSL/TLS → Origin Server → Create Certificate
#        Hostnames: bidar-app.ir, www.bidar-app.ir
#        Validity: 15 years
#   4. On VPS, save the cert + key:
#        sudo mkdir -p /etc/nginx/ssl
#        sudo nano /etc/nginx/ssl/bidar.crt   # paste Origin Certificate
#        sudo nano /etc/nginx/ssl/bidar.key   # paste Private Key
#        sudo chmod 600 /etc/nginx/ssl/bidar.key
#
# Install this site:
#   sudo cp deploy/nginx-bidar.example.conf /etc/nginx/sites-available/bidar
#   sudo ln -sf /etc/nginx/sites-available/bidar /etc/nginx/sites-enabled/bidar
#   sudo rm -f /etc/nginx/sites-enabled/miogen
#   sudo nginx -t && sudo systemctl reload nginx
#
# You do NOT need Certbot / Let's Encrypt when using Cloudflare Origin CA.

# HTTP → HTTPS (Cloudflare Flexible still hits :80; Full/Strict uses :443)
server {
    listen 80;
    listen [::]:80;
    server_name bidar-app.ir www.bidar-app.ir;

    # Allow Cloudflare / health checks on plain HTTP if needed
    location /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://bidar-app.ir$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bidar-app.ir;

    ssl_certificate     /etc/nginx/ssl/bidar.crt;
    ssl_certificate_key /etc/nginx/ssl/bidar.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://bidar-app.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bidar-app.ir;

    ssl_certificate     /etc/nginx/ssl/bidar.crt;
    ssl_certificate_key /etc/nginx/ssl/bidar.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Cloudflare real IP (optional but useful for logs / rate limits)
    # https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 50M;

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # FastAPI backend (same-origin /api)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location ~ ^/api/(docs|redoc|openapi\.json)$ {
        return 404;
    }
}
